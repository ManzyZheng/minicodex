<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniCodex · Local Agent Console</title>
  <link rel="stylesheet" href="/static/app.css?v=turns-1">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">MC</span><div><strong>MiniCodex</strong><span>LOCAL AGENT CONSOLE</span></div></div>
    <dl class="session-facts">
      <div><dt>STATUS</dt><dd id="session-status" class="status-pill">CONNECTING</dd></div>
      <div><dt>MODEL</dt><dd id="model-name">—</dd></div>
      <div><dt>VERIFIED</dt><dd id="verification-status">NOT_RUN</dd></div>
    </dl>
  </header>
  <main class="shell">
    <section class="workspace-strip" aria-label="当前工作区"><span>WORKSPACE</span><code id="workspace-path">正在连接本机会话…</code></section>
    <section class="run-panel" aria-labelledby="run-heading">
      <div class="section-heading"><div><span class="eyebrow">LIVE AGENT SESSION</span><h1 id="run-heading">当前任务与历史</h1></div><p>当前轮实时展开 · 历史轮按需查看</p></div>
      <div id="timeline" class="timeline" aria-live="polite">
        <article id="empty-state" class="empty-state"><span class="empty-index">00</span><div><h2>等待第一条任务</h2><p>当前轮会展示推理与执行过程；完成后只展开最终结果。</p></div></article>
      </div>
    </section>
  </main>
  <form id="prompt-form" class="composer">
    <label for="prompt-input">NEXT INSTRUCTION</label>
    <textarea id="prompt-input" rows="3" maxlength="20000" placeholder="例如：检查测试失败，定位并修复 Bug，然后运行测试验证。"></textarea>
    <div class="composer-actions"><span>Enter 发送 · Shift+Enter 换行</span><button id="send-button" type="submit">运行任务 →</button></div>
  </form>
  <dialog id="approval-dialog" class="approval-dialog">
    <form method="dialog"><span class="eyebrow warning">COMMAND APPROVAL</span><h2>允许 Agent 执行命令？</h2><p id="approval-purpose"></p><pre><code id="approval-command"></code></pre><p id="approval-timeout" class="muted"></p><div class="approval-actions"><button id="reject-command" type="button" class="secondary">拒绝</button><button id="allow-command" type="button">允许执行</button></div></form>
  </dialog>
  <script src="/static/markdown.js?v=markdown-1" defer></script>
  <script src="/static/app.js?v=turns-1" defer></script>
</body>
</html>
