[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicodex"
version = "0.1.0"
description = "A small, safe, OpenAI-compatible coding agent for teaching and demos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minicodex = "minicodex.cli:main"

[tool.setuptools.package-data]
minicodex = ["web/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
